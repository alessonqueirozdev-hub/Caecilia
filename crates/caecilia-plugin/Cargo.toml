[package]
name = "caecilia-plugin"
description = "Caecilia as a CLAP and VST3 instrument"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
caecilia-model.workspace = true
caecilia-engine.workspace = true
caecilia-registration.workspace = true
caecilia-wind.workspace = true
manguebyte-core.workspace = true
manguebyte-dsp.workspace = true
manguebyte-params.workspace = true
manguebyte-plugin.workspace = true
manguebyte-midi.workspace = true
manguebyte-clap.workspace = true
manguebyte-vst3.workspace = true
# The console (src/ui), drawn with the framework's toolkit.
manguebyte-gfx.workspace = true
manguebyte-gui.workspace = true
manguebyte-ui.workspace = true
# Only for the standalone application: the sound card, and the console in a
# window of its own.
manguebyte-standalone = { workspace = true, optional = true }
manguebyte-window = { workspace = true, optional = true }

[features]
## Builds the standalone application (src/bin/caecilia.rs).
standalone = ["dep:manguebyte-standalone", "dep:manguebyte-window"]

[[bin]]
name = "caecilia"
required-features = ["standalone"]

[dev-dependencies]
# The console's tests open it headless.
manguebyte-gui = { workspace = true, features = ["headless"] }
caecilia-registration.workspace = true
# Loads the built bundles the way a host does (examples/host_check.rs).
manguebyte-host = { path = "C:/manguebyte/crates/manguebyte-host", default-features = false, features = ["clap", "vst3"] }

[package.metadata.manguebyte]
name = "Caecilia"

[lints]
workspace = true
