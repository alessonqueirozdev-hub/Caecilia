[package]
name = "caecilia-installer"
description = "Caecilia's Windows installer: the app and the plugins, with an uninstaller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "caecilia-setup"
path = "src/main.rs"

[[bin]]
name = "caecilia-pack"
path = "src/bin/caecilia-pack.rs"

[dependencies]
serde_json.workspace = true
# The payload: its hashes, and its compression.
sha2 = "0.11"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "encoder", "optimization"] }
# The wizard, drawn in the console's materials.
manguebyte-gfx.workspace = true
manguebyte-ui.workspace = true
manguebyte-gui.workspace = true
manguebyte-window.workspace = true
manguebyte-plugin.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Shortcuts are COM objects (IShellLinkW).
windows = { version = "=0.62.2", features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
manguebyte-gui = { workspace = true, features = ["headless"] }

[lints]
workspace = true
