#
# Builds Caecilia 2.0 on Windows: formatting, clippy, every test, the CLAP
# and VST3 bundles (made by Manguebyte's own `cargo mangue`) put through a
# host, and the standalone application; uploads the bundles and the
# application; builds the installer (caecilia-dist) and uploads it too.
#
# Caecilia depends on Manguebyte by path while both are developed side by
# side (`C:/manguebyte/crates/...` in Cargo.toml), so the job checks the
# framework out at exactly that path. No test opens an audio device.

name: Build Caecilia

on:
  push:
    branches: [main, rust-2.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows (tests, bundles, standalone)
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: C:\manguebyte\target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Check out Manguebyte where Cargo.toml expects it
        run: git clone --depth 1 https://github.com/alessonqueirozdev-hub/manguebyte.git C:\manguebyte

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --profile caecilia --workspace --all-targets --features caecilia-plugin/standalone -- -D warnings

      - name: Tests
        run: cargo test --profile caecilia --workspace

      - name: Bundles (cargo mangue)
        run: cargo run --release --manifest-path C:\manguebyte\crates\cargo-mangue\Cargo.toml -- mangue bundle -p caecilia-plugin --profile caecilia-release --format clap,vst3

      - name: The bundles in a host
        run: cargo run --profile caecilia-release -p caecilia-plugin --example host_check -- C:\manguebyte\target\bundled\Caecilia.clap C:\manguebyte\target\bundled\Caecilia.vst3

      - name: Standalone application
        run: cargo build --profile caecilia-release -p caecilia-plugin --features standalone --bin caecilia

      - name: Installer
        run: cargo run --profile caecilia-release -p caecilia-installer --bin caecilia-dist -- build --target-dir C:\manguebyte\target

      - uses: actions/upload-artifact@v4
        with:
          name: Caecilia-windows
          path: |
            C:\manguebyte\target\bundled\Caecilia.clap
            C:\manguebyte\target\bundled\Caecilia.vst3
            C:\manguebyte\target\caecilia-release\caecilia.exe
            C:\manguebyte\target\installer\Caecilia-Setup-*.exe
