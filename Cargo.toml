#
# Caecilia 2.0 -- the organ in Rust, on the Manguebyte Audio Framework.
# See docs/PORTING.md for what each crate is and where it came from.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/alessonqueirozdev-hub/Caecilia"
authors = ["Alesson Queiroz", "The Caecilia contributors"]

[workspace.dependencies]
caecilia-model = { path = "crates/caecilia-model" }
caecilia-wind = { path = "crates/caecilia-wind" }
caecilia-synth = { path = "crates/caecilia-synth" }
caecilia-engine = { path = "crates/caecilia-engine" }
caecilia-registration = { path = "crates/caecilia-registration" }

# The framework, by path while both change together: clone Manguebyte beside
# this repository (see CONTRIBUTING.md). To be pinned to a git revision or a
# published version once its API settles, so one clone is enough.
manguebyte-core = { path = "../manguebyte/crates/manguebyte-core" }
manguebyte-dsp = { path = "../manguebyte/crates/manguebyte-dsp" }
manguebyte-params = { path = "../manguebyte/crates/manguebyte-params" }
manguebyte-plugin = { path = "../manguebyte/crates/manguebyte-plugin" }
manguebyte-midi = { path = "../manguebyte/crates/manguebyte-midi" }
manguebyte-clap = { path = "../manguebyte/crates/manguebyte-clap" }
manguebyte-vst3 = { path = "../manguebyte/crates/manguebyte-vst3" }
manguebyte-standalone = { path = "../manguebyte/crates/manguebyte-standalone" }
manguebyte-gfx = { path = "../manguebyte/crates/manguebyte-gfx" }
manguebyte-ui = { path = "../manguebyte/crates/manguebyte-ui" }
manguebyte-gui = { path = "../manguebyte/crates/manguebyte-gui" }
manguebyte-window = { path = "../manguebyte/crates/manguebyte-window" }

serde_json = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

# Tests render seconds of a full organ, which an unoptimised build makes slow
# enough to matter; checks stay on:
#   cargo test --profile caecilia --workspace
[profile.caecilia]
inherits = "dev"
opt-level = 2
debug = 0

[profile.caecilia-release]
inherits = "release"
